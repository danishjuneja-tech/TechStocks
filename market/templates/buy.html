<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy {{ stock.symbol }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .box {
            max-width: 500px;
            margin: 80px auto;
            background: #1e293b;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin: 25px;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 15px 0;
            border-radius: 8px;
            border: none;
            font-size: 18px;
        }

        button {
            width: 95%;
            padding: 14px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Buy Stock</h1>

    <h2>{{ stock.name }}</h2>

    <p>{{ stock.symbol }}</p>

    <div class="price">
        ₹{{ stock.price }}
    </div>

    <form method="post">

        {% csrf_token %}

        <input
            type="number"
            name="quantity"
            min="1"
            placeholder="Enter quantity"
            required
        >

        <button type="submit">
            BUY SHARES
        </button>

    </form>

    <a class="back" href="{% url 'market_home' %}">
        ← Back to Market
    </a>

</div>

</body>
</html>
