<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>{{ symbol }} Stock</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(
                circle at top right,
                #172554 0%,
                #0f172a 40%,
                #020617 100%
            );
        color: white;
        min-height: 100vh;
    }

    nav {
        background: rgba(15, 23, 42, 0.96);
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);

        padding: 18px 30px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 20px;
    }

    nav h1 {
        margin: 0;
        color: #38bdf8;
        font-size: 24px;
    }

    .back {
        color: white;
        text-decoration: none;

        background: #2563eb;

        padding: 10px 16px;

        border-radius: 8px;

        font-weight: bold;

        transition: 0.2s;
    }

    .back:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    .container {
        max-width: 1100px;

        margin: 40px auto;

        padding: 20px;
    }

    .card {
        background:
            linear-gradient(
                145deg,
                rgba(30, 41, 59, 0.98),
                rgba(15, 23, 42, 0.98)
            );

        border: 1px solid rgba(148, 163, 184, 0.13);

        border-radius: 18px;

        padding: 25px;

        margin-bottom: 20px;

        box-shadow:
            0 15px 45px rgba(0, 0, 0, 0.25);
    }

    .stock-title {
        font-size: 30px;
        margin: 0 0 8px;
    }

    .symbol {
        color: #94a3b8;
        font-size: 16px;
    }

    .price {
        font-size: 42px;
        font-weight: bold;

        margin-top: 15px;

        color: #38bdf8;
    }

    .status {
        color: #94a3b8;
        margin-top: 10px;
    }

    .live-status {
        color: #22c55e;
        font-weight: bold;
    }

    .chart-box {
        position: relative;
        height: 500px;
    }

    canvas {
        width: 100% !important;
        height: 100% !important;
    }

    .error {
        color: #ef4444;
        font-weight: bold;
        margin-top: 10px;
    }

    @media (max-width: 650px) {

        nav {
            padding: 15px;
        }

        nav h1 {
            font-size: 19px;
        }

        .container {
            margin: 20px auto;
            padding: 12px;
        }

        .card {
            padding: 20px;
        }

        .price {
            font-size: 34px;
        }

        .chart-box {
            height: 350px;
        }
    }

</style>
```

</head>

<body>

<nav>

```
<h1>📈 Danish Stock Market</h1>

<a
    href="{% url 'market_home' %}"
    class="back"
>
    ← Market
</a>
```

</nav>

<div class="container">

```
<div class="card">

    <h2
        class="stock-title"
        id="stockName"
    >
        {{ symbol }}
    </h2>


    <div
        class="symbol"
        id="stockSymbol"
    >
        ({{ symbol }})
    </div>


    <div
        class="price"
        id="currentPrice"
    >
        ₹0.00
    </div>


    <div class="status">

        <span
            class="live-status"
            id="liveStatus"
        >
            🟢 LIVE
        </span>

        • Updating every 2 seconds

    </div>


    <div
        class="error"
        id="errorMessage"
        style="display:none;"
    ></div>

</div>


<div class="card">

    <div class="chart-box">

        <canvas id="stockChart"></canvas>

    </div>

</div>
```

</div>

<script>


const symbol = "{{ symbol|escapejs }}";


/*
 * IMPORTANT:
 *
 * This is NOT the HTML stock_chart page.
 *
 * We use the same stock_chart URL with:
 *
 * ?api=1
 *
 * The Django view will return JSON when
 * api=1 is present.
 */

const apiUrl =
    "{% url 'stock_chart' symbol %}?api=1";


const ctx =
    document
        .getElementById("stockChart")
        .getContext("2d");


const chart =
    new Chart(
        ctx,
        {
            type: "line",

            data: {

                labels: [],

                datasets: [

                    {

                        label: symbol + " Price",

                        data: [],

                        borderWidth: 3,

                        pointRadius: 2,

                        tension: 0.25,

                        fill: false

                    }

                ]

            },


            options: {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,


                plugins: {

                    legend: {

                        display: true

                    }

                },


                scales: {

                    x: {

                        title: {

                            display: true,

                            text: "Time"

                        }

                    },


                    y: {

                        title: {

                            display: true,

                            text: "Price (₹)"

                        }

                    }

                }

            }

        }
    );



async function updateChart() {

    const status =
        document.getElementById(
            "liveStatus"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    try {


        const response =
            await fetch(
                apiUrl +
                "&t=" +
                Date.now(),
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Accept": "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        /*
         * Update stock name
         */

        document
            .getElementById("stockName")
            .innerText =
                result.name;


        /*
         * Update symbol
         */

        document
            .getElementById("stockSymbol")
            .innerText =
                "(" +
                result.symbol +
                ")";


        /*
         * Update current price
         */

        const currentPrice =
            Number(
                result.current_price
            );


        document
            .getElementById("currentPrice")
            .innerText =
                "₹" +
                currentPrice.toFixed(2);


        /*
         * Update graph
         */

        const history =
            Array.isArray(result.data)
                ? result.data
                : [];


        chart.data.labels =
            history.map(
                function(item) {
                    return item.time;
                }
            );


        chart.data.datasets[0].data =
            history.map(
                function(item) {
                    return Number(
                        item.price
                    );
                }
            );


        chart.data.datasets[0].label =
            result.symbol +
            " Price";


        chart.update("none");


        /*
         * Live status
         */

        const now =
            new Date()
                .toLocaleTimeString();


        status.innerText =
            "🟢 LIVE • Updated " +
            now;


        status.style.color =
            "#22c55e";


        errorMessage.style.display =
            "none";


    }


    catch (error) {


        console.error(
            "Chart update failed:",
            error
        );


        status.innerText =
            "🔴 Connection error";


        status.style.color =
            "#ef4444";


        errorMessage.innerText =
            "Could not load live stock data.";


        errorMessage.style.display =
            "block";

    }

}


/*
 * First update immediately
 */

updateChart();


/*
 * Update every 2 seconds
 */

setInterval(
    updateChart,
    2000
);


</script>

</body>

</html>
