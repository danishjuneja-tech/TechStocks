<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Limit Sell - {{ stock.symbol }}</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .box {
            width: 400px;
            max-width: 90%;
            background: #1e293b;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        h1 {
            color: #38bdf8;
            margin-top: 0;
        }

        .info {
            color: #cbd5e1;
            line-height: 1.7;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b91c1c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #38bdf8;
            text-decoration: none;
        }

        .message {
            background: #334155;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>🔴 Limit Sell</h1>

    <div class="info">

        <strong>{{ stock.name }}</strong>
        ({{ stock.symbol }})

        <br>

        Current Price:
        ₹{{ stock.price }}

        <br>

        Your Shares:
        {{ holding.quantity|default:"0" }}

    </div>

    {% for message in messages %}

        <div class="message">
            {{ message }}
        </div>

    {% endfor %}

    <form method="post">

        {% csrf_token %}

        <label>
            Quantity
        </label>

        <input
            type="number"
            name="quantity"
            min="1"
            max="{{ holding.quantity }}"
            required
        >

        <label>
            Sell when price reaches
        </label>

        <input
            type="number"
            name="limit_price"
            min="0.01"
            step="0.01"
            placeholder="Example: 150.00"
            required
        >

        <button type="submit">
            🔴 Set Limit Sell
        </button>

    </form>

    <a
        class="back"
        href="{% url 'sell_stock' stock.symbol %}"
    >
        ← Back to Sell
    </a>

</div>

</body>

</html>
