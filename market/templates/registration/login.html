```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Danish Stock Market</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .login-box {
            width: 380px;
            background: #1e293b;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #334155;
            color: white;
        }

        input:focus {
            outline: 2px solid #38bdf8;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #38bdf8;
            text-decoration: none;
        }

        .error {
            background: #7f1d1d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>📈 Login</h1>

    <p class="subtitle">
        Danish Stock Market
    </p>

    {% if form.errors %}
        <div class="error">
            Username or password is incorrect.
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label for="id_username">
            Username
        </label>

        <input
            type="text"
            name="username"
            id="id_username"
            placeholder="Enter username"
            required
            autofocus
        >

        <label for="id_password">
            Password
        </label>

        <input
            type="password"
            name="password"
            id="id_password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

    </form>

    <a class="back" href="{% url 'market_home' %}">
        ← Back to Market
    </a>

</div>

</body>
</html>
```
